{% set name = "fractal-task-tools" %}
{% set version = "0.5.1" %}
{% set python_min = "3.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fractal_task_tools-{{ version }}.tar.gz
  sha256: 20642e00325f5edbf39113bd84490557ea6fd7f716ef2e4abc1ab9cf77aa6f28

build:
  entry_points:
    - fractal-manifest = fractal_task_tools._cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }},<=3.13.0
    - setuptools >=80.0
    - pip
  run:
    - pydantic-core
    - python >={{ python_min }},<=3.13.0
    - pydantic >=2.11.0,<=2.14.0
    - docstring_parser >=0.15,<=0.18
    - packaging

test:
  imports:
    - fractal_task_tools
  commands:
    - pip check
    - fractal-manifest --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Shared tools for Fractal tasks
  home: https://github.com/fractal-analytics-platform/fractal-task-tools
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mfranzon
    - jluethi
    - tcompa
