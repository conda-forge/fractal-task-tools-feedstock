{% set name = "fractal-task-tools" %}
{% set version = "0.5.0" %}
{% set python_min = "3.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fractal_task_tools-{{ version }}.tar.gz
  sha256: fbcde9f9c2e5975c57956cda3763e0d7695cdd1d5d32cffbd0386595c2eb5673

build:
  entry_points:
    - fractal-manifest = fractal_task_tools._cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }},<=3.13.0
    - setuptools >=80.0
    - pip
  run:
    - pydantic-core
    - python >={{ python_min }},<=3.13.0
    - pydantic >=2.11.0,<2.13.0
    - docstring_parser >=0.15,<=0.17
    - packaging

test:
  imports:
    - fractal_task_tools
  commands:
    - pip check
    - fractal-manifest --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Shared tools for Fractal tasks
  home: https://github.com/fractal-analytics-platform/fractal-task-tools
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mfranzon
    - jluethi
    - tcompa
